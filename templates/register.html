<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Secure Document System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>Join Us</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Create your account to start securing files</p>

    <form method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label for="role">Account Type</label>
            <select id="role" name="role" required>
                <option value="user">User - Manage your own files</option>
                <option value="auditor">Auditor - Verify system-wide integrity</option>
                <option value="admin">Admin - Full system management</option>
            </select>
        </div>
        
        <button type="submit">Create Account</button>
    </form>

    <div class="nav-actions">
        <a href="/login" class="btn btn-secondary">Back to Login</a>
    </div>
</div>

</body>
</html>
