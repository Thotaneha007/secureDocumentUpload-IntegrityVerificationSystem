<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure Document System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>Welcome Back</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Login to access your secure documents</p>

    <form method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
            <label for="mfa_token">Authenticator Code</label>
            <p style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 10px;">Enter the 6-digit code from your authenticator app.</p>
            <input type="text" id="mfa_token" name="mfa_token" placeholder="000000" maxlength="6" autocomplete="one-time-code" style="letter-spacing: 4px; font-weight: 700; text-align: center; font-size: 20px;">
        </div>
        
        <button type="submit">Sign In Securely</button>
    </form>

    <div class="nav-actions">
        <a href="/register" class="btn btn-secondary">Create Account</a>
    </div>
</div>

</body>
</html>
